services:
  - type: web
    name: paypal-voice-bazaar-free
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /tmp/voice_bazaar.db
      - key: DEMO_MODE
        value: "true"
      - key: FREE_MODE
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
